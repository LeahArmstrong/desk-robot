[env]
build_src_filter = +<*> -<audio_only.cpp>

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
# Quiet the core's "connection reset" spam while the brain server is down.
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.19
    madhephaestus/ESP32Servo@^3.0.5
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0

# Leah's stationary 2.42-inch OLED build; upstream hardware remains selectable.
[env:xiao_ssd1309]
extends = env:xiao_esp32s3
platform = espressif32@7.1.3
build_flags = ${env:xiao_esp32s3.build_flags} -DDESK_ROBOT_SSD1309
lib_deps =
    olikraus/U8g2@2.36.18
    madhephaestus/ESP32Servo@3.2.1
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3

# Diagnostic fallback only for panels verified to omit ACK; slower redraw.
[env:xiao_ssd1309_noack]
extends = env:xiao_ssd1309
build_flags = ${env:xiao_ssd1309.build_flags} -DDESK_ROBOT_OLED_NOACK

# USB bench diagnostic: only serial and direct I2S output, no robot subsystems.
[env:xiao_audio_only]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_filter = -<*> +<audio_only.cpp>
